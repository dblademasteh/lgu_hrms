version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lgu_hrms
    ports:
      - "5432:5432"
  api:
    build: ./backend
    ports:
      - "4000:4000"
    depends_on:
      - db
  web:
    build: ./frontend
    ports:
      - "5173:5173"
