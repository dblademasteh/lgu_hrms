# Reverse-proxy /api/* to the backend so the SPA runs same-origin in prod.
# The vite dev server handles this locally; nginx handles it in the image.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip static assets
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # API → backend service (same compose network)
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # SPA fallback — React Router handles client-side routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache the entrypoint; cache hashed assets aggressively
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
