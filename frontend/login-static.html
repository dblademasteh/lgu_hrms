<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LGU HRMS Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 flex items-center justify-center">
<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
<div class="flex items-center gap-3 mb-6">
<div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold">L</div>
<div>
<h1 class="text-2xl font-extrabold text-slate-900">LGU HRMS</h1>
<p class="text-slate-500 text-sm">Human Resource Management</p>
</div>
</div>
<p class="text-slate-600 mb-6">Sign in to your account</p>
<form class="space-y-5">
<div>
<label class="block text-sm font-semibold text-slate-700 mb-1">Email Address</label>
<input type="email" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 bg-slate-50" placeholder="you@lgu.gov.ph"/>
</div>
<div>
<label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
<input type="password" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 bg-slate-50"/>
</div>
<button class="w-full bg-blue-600 text-white rounded-xl py-3 font-semibold">Sign In</button>
</form>
</div>
</body>
</html>
